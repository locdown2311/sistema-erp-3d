version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-3d-app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      # Persiste o banco de dados principal SQLite
      - erp-db:/var/www/html/database
      # Persiste os arquivos estáticos upados pelos clientes e lojista
      - erp-storage:/var/www/html/storage/app/public
      # (Opcional) descomente se quiser usar o storage/logs persistido:
      # - erp-logs:/var/www/html/storage/logs

volumes:
  erp-db:
  erp-storage:
  erp-logs:
